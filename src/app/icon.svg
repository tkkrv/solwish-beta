<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Фирменный градиент Solana -->
    <linearGradient id="solGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9945FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Скругленный темный фон под стиль Web3 -->
  <rect width="64" height="64" rx="16" fill="#0D0E15" />
  <rect width="64" height="64" rx="16" stroke="url(#solGradient)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Основа подарка -->
  <g filter="url(#glow)">
    <!-- Нижняя часть коробки -->
    <rect x="15" y="27" width="34" height="23" rx="5" fill="#161822" stroke="url(#solGradient)" stroke-width="2.5" />
    <!-- Крышка коробки -->
    <rect x="12" y="21" width="40" height="8" rx="3" fill="#161822" stroke="url(#solGradient)" stroke-width="2.5" />
    
    <!-- Вертикальная лента -->
    <path d="M32 21V50" stroke="url(#solGradient)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Бант в форме искры желаний (Wish Sparkle) -->
    <path d="M32 13C32 13 30 18 24 18C28 20 32 21 32 21C32 21 36 20 40 18C34 18 32 13 32 13Z" fill="url(#solGradient)" />
    
    <!-- Волшебная звезда / искра Solana -->
    <path d="M48 12L49.2 15.5L53 16.5L49.8 18.5L49.5 22L46.8 19.5L43 20L45 17L44 13.5L47 14.5L48 12Z" fill="#14F195" />
  </g>
</svg>
